<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #slot {
            font-size: 40px;
            margin-top: 20px;
        }

        #time {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>PARKING SYSTEM</h1>

    <div id="time">
        Menunggu data...
    </div>

    <div id="slot">
        Sisa Slot: -
    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


        // =========================
        // FIREBASE CONFIG
        // =========================

        const firebaseConfig = {
          apiKey: "AIzaSyCnC0ChTe6cZmoNQV0VLM2c4cRbfESFvZE",
          authDomain: "parking-slot-2e3a2.firebaseapp.com",
          databaseURL: "https://parking-slot-2e3a2-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "parking-slot-2e3a2",
          storageBucket: "parking-slot-2e3a2.firebasestorage.app",
          messagingSenderId: "365291472545",
          appId: "1:365291472545:web:9f8c35c16d94dd4c2b92e0"
        };


        // =========================
        // FIREBASE
        // =========================

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        // =========================
        // BACA DATA SLOT
        // =========================

        const slotRef = ref(database, "parking/slot");


        onValue(slotRef, (snapshot) => {

            const slot = snapshot.val();


            // Tampilkan jumlah slot
            document.getElementById("slot").textContent =
                "Sisa Slot: " + slot;


            // Waktu data diterima
            const now = new Date();

            const time =
                now.toLocaleTimeString("id-ID", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                });


            document.getElementById("time").textContent =
                "Data terakhir diterima: " + time;

        });

    </script>

</body>
</html>
